    <script>
        nama = window.prompt("nama");
        nilai = window.prompt("nilai");
        alert(cekNilai(nilai));
        function cekNilai(nilai) {
            if (nilai >= 60) {
                return "Lulus";
            }
            else {
                return "Gagal";
            }
        }

        alert(Grade(nilai));
        function Grade(nilai) {
            if (nilai >= 85) {
                return "Grade : A";
            }
            else if (nilai >= 80 && nilai < 85) {
                return "Grade : A-";
            }
            else if (nilai >= 80 && nilai < 85) {
                return "Grade : B+";
            }
            else if (nilai >= 75 && nilai < 80) {
                return "Grade : B";
            }
            else if (nilai >= 70 && nilai < 85) {
                return "Grade : B-";
            }
            else if (nilai >= 65 && nilai < 70) {
                return "Grade : C+";
            }
            else if (nilai >= 60 && nilai < 65) {
                return "Grade : C";
            }
            else if (nilai >= 55 && nilai < 60) {
                return "Grade : D";
            }
            else if (nilai >= 45 && nilai <55) {
                return "Grade : E";
            }
            else if (nilai == "Violation") {
                return "Grade : F";
            }
        }
    </script>
