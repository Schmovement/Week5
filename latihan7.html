<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan 7</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <div>
        <p>Hasil Latihan 7 - Russell James Ryan 🤪. </p>
    </div>
    <div id="result7"></div>
    <nav>
        <ul>
            <li>
                <button>
                    <a href="index.html">Home</a>
                </button>
            </li>
        </ul>
    </nav>
    <script>
        const senin = prompt("Jumlah mahasiswa yang masuk");
        const selasa = prompt("Jumlah mahasiswa yang masuk");
        const rabu = prompt("Jumlah mahasiswa yang masuk");
        const kamis = prompt("Jumlah mahasiswa yang masuk");
        const jumat = prompt("Jumlah mahasiswa yang masuk");
        resultContainer = document.getElementById("result7");
        let outputHTML = "";
        outputHTML += `
        <b>Grafik Jumlah Kehadiran Mahasiswa</b>
        <br><b>Senin : </b>`;
        for (let i = 0; i < senin; i++) {
            outputHTML += "X";
        }

        outputHTML += `<br><br><b>Selasa : </b>`;
        for (let i = 0; i < selasa; i++) {
            outputHTML += "X";
        }

        outputHTML += `<br><br><b>Rabu : </b>`;
        for (let i = 0; i < rabu; i++) {
            outputHTML += "X";
        }

        outputHTML += `<br><br><b>Kamis : </b>`;
        for (let i = 0; i < kamis; i++) {
            outputHTML += "X";
        }

        outputHTML += `<br><br><b>Jumat : </b>`;
        for (let i = 0; i < jumat; i++) {
            outputHTML += "X";
        }
        resultContainer.innerHTML = outputHTML;
    </script>
</body>

</html>
