<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan 2</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="result"></div>

    <nav>
        <ul>
            <li>
                <button>
                    <a href="index.html">Home</a>
                </button>
            </li>
        </ul>
    </nav>

    <div>
        <p>Hasil Latihan 2 - Russell James Ryan 🤪</p>
    </div>

    <script>
        const resultContainer = document.getElementById("result");
        const jumlahMhs = parseInt(window.prompt("Jumlah Mahasiswa"), 10);

        if (!isNaN(jumlahMhs) && jumlahMhs > 0) {
            let outputHTML = "";
            for (let i = 1; i <= jumlahMhs; i++) {
                const nama = window.prompt(`Nama Mahasiswa ke-${i}`);
                const uts = parseFloat(window.prompt(`Nilai UTS ${nama}`)) || 0;
                const uas = parseFloat(window.prompt(`Nilai UAS ${nama}`)) || 0;
                const tugas = parseFloat(window.prompt(`Nilai Tugas ${nama}`)) || 0;

                const final = (tugas * 0.3) + (uts * 0.3) + (uas * 0.4);
                const grade = getGrade(final);
                outputHTML += `
                    <div class="student-card">
                        <strong>${i}. ${nama}</strong><br>
                        Tugas: ${tugas}<br>
                        UTS: ${uts}<br>
                        UAS: ${uas}<br>
                        Nilai Akhir: ${final.toFixed(2)}<br>
                        Grade: ${grade}
                    </div>
                `;
            }

            resultContainer.innerHTML = outputHTML;
        } else {
            resultContainer.innerHTML = "<div>Input jumlah mahasiswa tidak valid.</div>";
        }

        function getGrade(final) {
            if (final >= 85) return "A";
            if (final >= 80) return "A-";
            if (final >= 75) return "B+";
            if (final >= 70) return "B";
            if (final >= 65) return "B-";
            if (final >= 60) return "C+";
            if (final >= 55) return "C";
            if (final >= 45) return "D";
            return "E";
        }
    </script>
</body>

</html>
