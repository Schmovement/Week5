<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan 6</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <div>
        <p>Hasil Latihan 6 - Russell James Ryan 🤪. </p>
    </div>
    <div id="result"></div>
    <nav>
        <ul>
            <li>
                <button>
                    <a href="index.html">Home</a>
                </button>
            </li>
        </ul>
    </nav>
    <script>
        const input = parseInt(prompt("Pick a random number"), 10);
        const resultContainer = document.getElementById("result");
        let outputHTML = "";
        if (isNaN(input) || input < 2) {
            outputHTML = "<br>Mohon input angka >= 2.";
        }
        else {
            const array = sieveOfEratosthenes(input);
            for (let i = 0; i < array.length; i++) {
                outputHTML += `
                ${array[i]}`
                console.log(array[i]);
            }
        }
        resultContainer.innerHTML = outputHTML;
        function sieveOfEratosthenes(limit) {
            if (limit < 2) return [];
            const isPrime = new Array(limit + 1).fill(true); //fitur lumayan jadi gk perlu loop buat set true ke semua elemen array
            isPrime[0] = false;
            isPrime[1] = false;

            const sqrtLimit = Math.floor(Math.sqrt(limit));
            for (let p = 2; p <= sqrtLimit; p++) {
                if (isPrime[p]) {
                    for (let multiple = p * p; multiple <= limit; multiple += p) {
                        isPrime[multiple] = false;
                    }
                }
            }
            const primes = [];
            for (let i = 2; i <= limit; i++) {
                if (isPrime[i]) {
                    primes.push(i);
                }
            }
            return primes;
        }
    </script>
</body>

</html>
